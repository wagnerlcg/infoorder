<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedepeloZap - Painel de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo exclusivo para impressão em impressora térmica (58mm / 80mm) */
        @media print {
            body * {
                visibility: hidden;
            }

            .ticket-impressao,
            .ticket-impressao * {
                visibility: visible;
            }

            .ticket-impressao {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                color: black;
                padding: 10px;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            🍔 <span class="text-orange-500">Pede pelo Zap!</span> - Painel da Cozinha
        </h1>
        <div class="flex items-center gap-3">
            <span id="status-conexao" class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
            <span id="status-texto" class="text-sm text-gray-400">Conectando...</span>
        </div>
    </header>

    <!-- Grid de Pedidos -->
    <main id="pedidos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Os pedidos chegam aqui em tempo real -->
    </main>

    <script>
        const container = document.getElementById('pedidos-container');
        const statusConexao = document.getElementById('status-conexao');
        const statusTexto = document.getElementById('status-texto');

        // Conecta ao Stream em Tempo Real (SSE) do Backend
        // const evtSource = new EventSource('/api/stream-pedidos');
        const evtSource = new EventSource('https://pedepelozap.infosystem.pro/api/stream-pedidos');

        // Quando a conexão dá certo (Bolinha Verde)
        evtSource.onopen = function () {
            console.log("Conexão SSE estabelecida com sucesso!");

            const statusDot = document.getElementById('status-conexao');
            const statusText = document.getElementById('status-texto');

            if (statusDot) {
                statusDot.classList.remove('bg-red-500');
                statusDot.classList.add('bg-green-500');
            }
            if (statusText) {
                statusText.innerText = "Sistema Conectado";
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-green-500'); // Opcional: deixa o texto verde também
            }
        };

        // Quando a conexão dá certo (Bolinha Verde)
        evtSource.onopen = function () {
            console.log("Conexão SSE estabelecida com sucesso!");

            const statusDot = document.getElementById('status-conexao');
            const statusText = document.getElementById('status-texto');

            if (statusDot) {
                statusDot.classList.remove('bg-red-500');
                statusDot.classList.add('bg-green-500');
            }
            if (statusText) {
                statusText.innerText = "Sistema Conectado";
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-green-500'); // Opcional: deixa o texto verde também
            }
        };

        evtSource.onmessage = function (event) {
            // Se a mensagem for apenas um ping de segurança, ignorar
            if (event.data.trim() === 'ping') return;

            const pedido = JSON.parse(event.data);

            // Construir o HTML dos itens garantindo a leitura de pedido.itens
            let itensHTML = '';
            if (pedido.itens && pedido.itens.length > 0) {
                pedido.itens.forEach(item => {
                    itensHTML += `
                <div class="mb-2">
                    <span class="font-bold text-orange-400">${item.quantidade || 1}x</span> 
                    <span class="text-white ml-1">${item.produto}</span>
                    ${item.observacao ? `<div class="text-sm text-gray-400 ml-6">- ${item.observacao}</div>` : ''}
                </div>
            `;
                });
            } else {
                itensHTML = '<p class="text-sm text-gray-500 italic">Nenhum item identificado pela IA.</p>';
            }

            // Inserir o cartão no painel
            // ... (o seu código existente que cria a div do cartão e injeta a variável itensHTML na secção "ITENS DO PEDIDO:")
        };
    </script>
</body>

</html>
