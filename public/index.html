<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedepeloZap - Painel de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo exclusivo para impressão em impressora térmica (58mm / 80mm) */
        @media print {
            body * {
                visibility: hidden;
            }

            .ticket-impressao,
            .ticket-impressao * {
                visibility: visible;
            }

            .ticket-impressao {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                color: black;
                padding: 10px;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            🍔 <span class="text-orange-500">Pede pelo Zap!</span> - Painel da Cozinha
        </h1>
        <div class="flex items-center gap-3">
            <span id="status-conexao" class="inline-block w-3 h-3 bg-red-500 rounded-full"></span>
            <span id="status-texto" class="text-sm text-gray-400">Conectando...</span>
        </div>
    </header>

    <!-- Grid de Pedidos -->
    <main id="pedidos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Os pedidos chegam aqui em tempo real -->
    </main>

    <script>
        const container = document.getElementById('pedidos-container');
        const statusConexao = document.getElementById('status-conexao');
        const statusTexto = document.getElementById('status-texto');

        // Conecta ao Stream em Tempo Real (SSE) do Backend
        // const evtSource = new EventSource('/api/stream-pedidos');
        const evtSource = new EventSource('https://pedepelozap.infosystem.pro/api/stream-pedidos');

        // Quando a conexão dá certo (Bolinha Verde)
        evtSource.onopen = function () {
            console.log("Conexão SSE estabelecida com sucesso!");

            const statusDot = document.getElementById('status-conexao');
            const statusText = document.getElementById('status-texto');

            if (statusDot) {
                statusDot.classList.remove('bg-red-500');
                statusDot.classList.add('bg-green-500');
            }
            if (statusText) {
                statusText.innerText = "Sistema Conectado";
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-green-500'); // Opcional: deixa o texto verde também
            }
        };

        // Quando a conexão dá certo (Bolinha Verde)
        evtSource.onopen = function () {
            console.log("Conexão SSE estabelecida com sucesso!");

            const statusDot = document.getElementById('status-conexao');
            const statusText = document.getElementById('status-texto');

            if (statusDot) {
                statusDot.classList.remove('bg-red-500');
                statusDot.classList.add('bg-green-500');
            }
            if (statusText) {
                statusText.innerText = "Sistema Conectado";
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-green-500'); // Opcional: deixa o texto verde também
            }
        };

        evtSource.onmessage = function (event) {
            // Ignora os pings de manutenção do Easypanel/Nginx para não quebrar o JSON
            if (event.data.includes('ping')) return;

            try {
                const pedido = JSON.parse(event.data);
                console.log("Chegou na cozinha:", pedido);

                // Monta o bloco HTML varrendo exatamente o array "itens" gerado pela IA
                let itensHTML = '';
                if (pedido.itens && pedido.itens.length > 0) {
                    pedido.itens.forEach(item => {
                        itensHTML += `
                    <div class="mb-2">
                        <span class="font-bold text-orange-400">${item.quantidade}x</span> 
                        <span class="text-white ml-1">${item.produto}</span>
                        ${item.observacao ? `<div class="text-sm text-gray-400 ml-5">- ${item.observacao}</div>` : ''}
                    </div>
                `;
                    });
                } else {
                    itensHTML = '<div class="text-sm text-gray-500 italic">Nenhum item identificado.</div>';
                }

                // Aqui você cria o layout do cartão e injeta o itensHTML
                // Exemplo da estrutura do seu card:
                const cardHTML = `
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-lg shadow-lg">
                <div class="flex justify-between items-start mb-3 border-b border-gray-700 pb-2">
                    <h3 class="text-orange-400 font-bold text-lg">${pedido.cliente_nome || 'Cliente WhatsApp'}</h3>
                    <span class="bg-gray-700 text-xs px-2 py-1 rounded text-gray-300 font-bold tracking-wide">
                        ${(pedido.tipo_pedido || 'DELIVERY').toUpperCase()}
                    </span>
                </div>
                
                <div class="mb-4 text-sm text-gray-300">
                    <div class="mb-1">📍 ${pedido.endereco_entrega || 'Retirada no balcão'}</div>
                    <div>💳 Pagamento: <span class="font-bold text-white">${pedido.forma_pagamento || 'Não informado'}</span></div>
                    ${pedido.troco_para ? `<div class="text-orange-300">Troco para: ${pedido.troco_para}</div>` : ''}
                </div>

                <div class="mb-2 text-xs font-bold text-gray-500 tracking-wider">ITENS DO PEDIDO:</div>
                <div class="mb-6">
                    ${itensHTML} <!-- Aqui os itens do x-bacon são injetados -->
                </div>

                <div class="flex gap-2">
                    <button class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded text-sm transition-colors">
                        🖨️ Imprimir
                    </button>
                    <button class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded text-sm transition-colors" onclick="this.parentElement.parentElement.remove()">
                        ✅ Concluir
                    </button>
                </div>
            </div>
        `;

                // Joga o cartão finalizado para dentro do container principal da tela
                const container = document.getElementById('pedidos-container'); // Ajuste para o ID da sua div principal
                if (container) {
                    container.insertAdjacentHTML('afterbegin', cardHTML);
                }

            } catch (error) {
                console.error("Erro ao montar o cartão na tela:", error);
            }
        };
    </script>
</body>

</html>
